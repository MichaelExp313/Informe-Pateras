<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#111;--m:#667;--a:#0a5cc2;--b:#d3d8e0;--r:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--c:#1b212a;--t:#eee;--m:#9aa5b1;--a:#5aa2ff;--b:#333c48;--r:#ef7a7a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--a);color:#fff}
header b{flex:1;font-size:17px}
#mb{background:none;border:0;color:#fff;font-size:26px}
#dr{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#dr.on{display:block}
#dr nav{background:var(--c);width:78%;max-width:300px;height:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 0}
#dr a{display:block;padding:15px 20px;border-bottom:1px solid var(--b)}
main{padding:12px;max-width:640px;margin:auto}
label{display:block;font-size:13px;color:var(--m);margin-top:12px}
input,select,textarea{width:100%;padding:11px;margin-top:4px;font-size:16px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.hide{display:none}
.btn{display:block;width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:var(--a);color:#fff;font-size:16px;text-align:center}
.btn.s{background:var(--c);color:var(--a);border:1px solid var(--a)}.btn.d{background:var(--r)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.ph{display:flex;gap:10px;margin-top:10px;align-items:center}
.ph img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.ph input{margin:0}.x{flex:0 0 auto!important;width:auto!important;background:none;border:0;color:var(--r);font-size:22px}
.y{background:#ffd400;color:#111;font-weight:700;font-size:18px;border:2px solid #b38f00}
.mnb{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--c);border-top:1px solid var(--b);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.mnb button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--b);color:var(--a);font-size:16px;font-weight:700}
body{padding-bottom:76px}
#mp{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#mp header{position:sticky;top:0;z-index:2}#mp header button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#mp .md{max-width:700px;margin:auto;padding:12px 14px 40px;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
#mp .md h1{font-size:24px}#mp .md h2{font-size:20px;margin-top:6px;color:var(--a)}#mp .md h3{font-size:16px}
#mp .md hr{border:0;border-top:1px solid var(--b);margin:18px 0}
#mp .md pre{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px;overflow-x:auto}
#mp .md code{font-size:13px}#mp .md a{color:var(--a)}
#mp .md blockquote{margin:10px 0;padding:2px 12px;border-left:4px solid var(--a);background:var(--c)}
#mp .tw{overflow-x:auto}#mp table{border-collapse:collapse;font-size:14px}#mp th,#mp td{border:1px solid var(--b);padding:6px 8px;text-align:left}#mp th{background:var(--c)}
.cw{position:relative}.cw input{padding-right:40px}.cx{position:absolute;right:0;top:4px;bottom:0;display:flex;align-items:center;padding:0 13px;background:none;border:0;color:var(--r);font-size:22px;font-weight:700;line-height:1}
.chip{background:var(--b);color:var(--a);border:0;border-radius:999px;padding:7px 13px;font-size:14px;margin:8px 6px 0 0;text-decoration:underline;cursor:pointer}
h3{margin:18px 0 0}pre{white-space:pre-wrap;word-break:break-word;font:14px monospace}
.fb{position:relative;overflow:hidden}.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;font-size:0;cursor:pointer}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#ov .card{width:100%;max-width:500px;max-height:90%;overflow:auto}#ov a.btn{text-decoration:none}
.ph select{margin-top:6px;padding:8px}.ph select.nt{border-color:var(--r)}
.u{display:flex;gap:6px;align-items:center;margin-top:6px}.u span{color:var(--m)}.u input{margin:0}
</style></head><body>

const MAN="<h1>🛟 Informe Patera<\/h1>\n<p>Aplicación web para generar el <strong>mensaje inicial<\/strong> de cada patera y gestionar sus <strong>fotos<\/strong> (UF y Menas), con base de datos local por patera. Se instala en el móvil como una app y <strong>no necesita servidor<\/strong>: todos los datos se guardan en el propio dispositivo.<\/p>\n<hr />\n<h2>📑 Índice<\/h2>\n<ol>\n<li><a href=\"#s1\">Instalar la app en el móvil<\/a><\/li>\n<li><a href=\"#s2\">Pantalla inicial y pateras<\/a><\/li>\n<li><a href=\"#s3\">Mensaje inicial: rellenar los campos<\/a><\/li>\n<li><a href=\"#s4\">Finalizar y compartir el mensaje<\/a><\/li>\n<li><a href=\"#s5\">Fotos: UF y Menas<\/a><\/li>\n<li><a href=\"#s6\">Finalizar las fotos y crear el ZIP<\/a><\/li>\n<li><a href=\"#s7\">Enviar un ZIP descargado (Chrome y Safari)<\/a><\/li>\n<li><a href=\"#s8\">Borrar pateras<\/a><\/li>\n<li><a href=\"#s9\">Problemas frecuentes<\/a><\/li>\n<\/ol>\n<hr />\n<h2 id=\"s1\">1. Instalar la app en el móvil<\/h2>\n<p>Así tendrás un icono junto a tus demás apps, sin abrir el navegador cada vez.<\/p>\n<h3>🤖 Android (Chrome)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Paso<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1️⃣<\/td>\n<td>Abre el enlace en <strong>Chrome<\/strong>. No lo abras desde WhatsApp ni otra app: copia el enlace y pégalo en Chrome.<\/td>\n<\/tr>\n<tr>\n<td>2️⃣<\/td>\n<td>Pulsa los <strong>3 puntos<\/strong> (⋮) arriba a la derecha.<\/td>\n<\/tr>\n<tr>\n<td>3️⃣<\/td>\n<td>Elige <strong>\"Añadir a pantalla de inicio\"<\/strong> (en algunos móviles: <strong>\"Instalar aplicación\"<\/strong>).<\/td>\n<\/tr>\n<tr>\n<td>4️⃣<\/td>\n<td>Pulsa <strong>Añadir / Instalar<\/strong>. El icono aparece en la pantalla de inicio y en el menú de apps.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>🍎 iPhone (Safari)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Paso<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1️⃣<\/td>\n<td>Abre el enlace en <strong>Safari<\/strong> (en otros navegadores no aparece la opción).<\/td>\n<\/tr>\n<tr>\n<td>2️⃣<\/td>\n<td>Pulsa <strong>Compartir<\/strong> (cuadrado con flecha hacia arriba, en la barra inferior).<\/td>\n<\/tr>\n<tr>\n<td>3️⃣<\/td>\n<td>Desliza y elige <strong>\"Añadir a pantalla de inicio\"<\/strong>. Si no la ves, baja hasta el final de la lista.<\/td>\n<\/tr>\n<tr>\n<td>4️⃣<\/td>\n<td>Pulsa <strong>Añadir<\/strong>. El icono queda en la pantalla de inicio.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>💡 <strong>Después de instalarla<\/strong>, abre siempre la app desde su icono. Los textos pueden variar según la marca y la versión del sistema.<\/p>\n<p>⚠️ Tus pateras y fotos se guardan <strong>en el móvil<\/strong>. Si borras los datos del navegador, también se borran.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s2\">2. Pantalla inicial y pateras<\/h2>\n<pre><code>┌──────────────────────────┐\n│ ☰  Informe Patera        │\n├──────────────────────────┤\n│ Nueva patera (número)    │\n│ [ 129                  ] │ ① Escribe el número\n│ [   Crear patera       ] │ ② Pulsa Crear patera\n│ [ 🟨 GUIA DE USO 🟨    ] │ ③ Abre la guía\n│                          │\n│ Pateras guardadas        │\n│ ┌──────────────────────┐ │\n│ │ Patera 129 · 12 fotos│ │ ④ Toca para abrir\n│ └──────────────────────┘ │\n└──────────────────────────┘\n<\/code><\/pre>\n<ol>\n<li><strong>Escribe el número<\/strong> de la patera (por ejemplo <code>129<\/code>).<\/li>\n<li>Pulsa <strong>Crear patera<\/strong>. Si el número ya existe, abre la que ya tenías.<\/li>\n<li>El botón amarillo <strong>GUIA DE USO<\/strong> abre la guía en PDF. Abajo, siempre visible, el botón <strong>Manual detallado<\/strong> abre este manual.<\/li>\n<li>En <strong>Pateras guardadas<\/strong>, toca una para abrirla, cambiar de patera y editar sus campos y fotos.<\/li>\n<li>El botón <strong>☰<\/strong> (arriba a la izquierda) abre el menú:<\/li>\n<\/ol>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Opción del menú<\/th>\n<th>Para qué sirve<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>🗂 Pateras<\/td>\n<td>Lista, crear y cambiar de patera<\/td>\n<\/tr>\n<tr>\n<td>📝 Mensaje inicial<\/td>\n<td>Rellenar y compartir el informe<\/td>\n<\/tr>\n<tr>\n<td>📷 Fotos<\/td>\n<td>Fotos UF y Menas y ZIP<\/td>\n<\/tr>\n<tr>\n<td>🗑 Borrar pateras<\/td>\n<td>Eliminar datos y fotos del móvil<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"s3\">3. Mensaje inicial: rellenar los campos<\/h2>\n<p>Abre <strong>☰ → Mensaje inicial<\/strong>. Todo se <strong>guarda solo<\/strong> mientras escribes.<\/p>\n<ul>\n<li><strong>Selectores con \"Otro\":<\/strong> en <em>Lugar de llegada<\/em>, <em>Requirente<\/em> y <em>Motores<\/em>, si eliges \"Otro\" aparece un cuadro para escribirlo.<\/li>\n<li><strong>Cantidades:<\/strong> solo números. Los campos de pulseras aparecen un poco a la derecha, dentro de su categoría (por ejemplo, dentro de <em>Menas varones<\/em>).<\/li>\n<li><strong>Pulseras:<\/strong> escríbelas como quieras: <code>1, 2, 3<\/code>, <code>1,2,3<\/code>, <code>P1,P2,P3<\/code> o <code>P 1, P 2, P 3<\/code>. Al pasar al siguiente campo se ven así: <code>P1, P2, P3<\/code>.<\/li>\n<li><strong>Unidades familiares y vinculadas:<\/strong> escribe cuántas hay y aparecen casillas numeradas. La casilla 1 trae un ejemplo (<code>Px padre Py hijo<\/code> en UF, <code>Px hermano mayor Py hermano menor<\/code> en UV): edítalo o bórralo. Si no lo tocas, no sale en el mensaje.<\/li>\n<li><strong>Nacionalidades:<\/strong> debajo del cuadro hay botones <strong>+Senegal, +Gambia, +Guinea, +Mauritania, +Guinea Bissau y +Costa Marfil<\/strong>. Al pulsarlos se añaden al cuadro, sin repetir. También puedes escribir a mano.<\/li>\n<li><strong>Textos ya escritos:<\/strong> <em>Avistamiento<\/em>, <em>Datos del rescate<\/em>, <em>Quién realiza el rescate<\/em> y <em>Datos embarcación<\/em> vienen con un texto escrito. Edítalo, o bórralo de golpe con la <strong>×</strong> roja del final del campo.<\/li>\n<\/ul>\n<h3>Qué escribes y qué sale en el mensaje<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Escribes<\/th>\n<th>Se ve en el campo<\/th>\n<th>Sale en el mensaje<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>17, 18<\/code><\/td>\n<td><code>P17, P18<\/code><\/td>\n<td><code>P-17 y P-18.<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>P1,P2,P3<\/code><\/td>\n<td><code>P1, P2, P3<\/code><\/td>\n<td><code>P-1, P-2 y P-3.<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>P 4, P 5<\/code><\/td>\n<td><code>P4, P5<\/code><\/td>\n<td><code>P-4 y P-5.<\/code><\/td>\n<\/tr>\n<tr>\n<td><em>(vacío)<\/em><\/td>\n<td><em>(vacío)<\/em><\/td>\n<td>Sin pulseras en esa línea<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"s4\">4. Finalizar y compartir el mensaje<\/h2>\n<ol>\n<li>Pulsa <strong>Finalizar mensaje inicial<\/strong> (al final de la pantalla).<\/li>\n<li><strong>Aviso de totales:<\/strong> la app comprueba que<\/li>\n<\/ol>\n<p><code>TOTAL PERSONAS = TOTAL MENORES + MUJERES ADULTAS + HOMBRES ADULTOS<\/code><\/p>\n<p>Si no coincide, muestra la <strong>diferencia<\/strong>.<\/p>\n<p><code>⚠ Los totales no coinciden\n   TOTAL PERSONAS: 56\n   Menores + mujeres + hombres: 55\n   Diferencia: 1\n   [ Finalizar de todos modos ]\n   [ Volver a editar ]<\/code><\/p>\n<ol>\n<li>Tú decides: <strong>Volver a editar<\/strong> para corregir, o <strong>Finalizar de todos modos<\/strong> si es correcto así.<\/li>\n<li>Se abre el <strong>menú de compartir<\/strong> del móvil: WhatsApp, correo, etc. Los totales salen en negrita en WhatsApp.<\/li>\n<li>Si no se abre, aparece una ventana con <strong>Copiar mensaje<\/strong>, <strong>Enviar por WhatsApp<\/strong> y <strong>Enviar por correo<\/strong>.<\/li>\n<li><strong>Ver / compartir mensaje<\/strong> muestra el texto completo para revisarlo y volver a enviarlo más tarde.<\/li>\n<\/ol>\n<blockquote>\n<p>✅ <strong>Ejemplo que cuadra:<\/strong> 55 personas = 8 menores + 5 mujeres adultas + 42 hombres adultos. No sale ningún aviso.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s5\">5. Fotos: UF y Menas<\/h2>\n<p>Abre <strong>☰ → Fotos<\/strong>. Hay cuatro zonas, en este orden: <strong>Fotos UF<\/strong>, <strong>Fotos hoja de filiación UF<\/strong>, <strong>Fotos Menas<\/strong> y <strong>Fotos hoja de filiación MENAS<\/strong>.<\/p>\n<ol>\n<li><strong>📷 Hacer foto:<\/strong> abre la cámara. La primera vez, el móvil pide permiso: pulsa <strong>Permitir<\/strong>.<\/li>\n<li><strong>🖼 Añadir desde la galería:<\/strong> elige una o varias fotos que ya tengas.<\/li>\n<li><strong>Escribe el nombre<\/strong> en el cuadro de debajo de cada foto:<\/li>\n<\/ol>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Zona<\/th>\n<th>Título del cuadro<\/th>\n<th>Ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>UF<\/strong> y su hoja de filiación<\/td>\n<td>Introducir N°UF-N°Foto<\/td>\n<td><code>1-1<\/code>, <code>2-1<\/code>, <code>2-2<\/code>, <code>3-1<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Menas<\/strong> y su hoja de filiación<\/td>\n<td>Introducir N°Pulsera menor<\/td>\n<td><code>1<\/code>, <code>2<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol>\n<li><strong>Tipo de menor (solo Menas y su hoja de filiación):<\/strong> debajo del nombre de cada foto hay un selector. Elige <strong>Menor Indubitado<\/strong> o <strong>Menor Dubitado<\/strong>. Mientras no lo elijas, el selector se ve con borde rojo.<\/li>\n<li><strong>✕ (roja):<\/strong> quita una foto.<\/li>\n<\/ol>\n<blockquote>\n<p>⚠️ El archivo se llamará <strong>exactamente<\/strong> como lo escribas. Si dejas una foto sin nombre, se guardará como <code>sin_nombre_1<\/code>, <code>sin_nombre_2<\/code>… Si repites un nombre en la misma carpeta, se añade <code>_2<\/code> para no perder ninguna.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s6\">6. Finalizar las fotos y crear el ZIP<\/h2>\n<ol>\n<li>Pulsa <strong>Finalizar y descargar ZIP<\/strong> (pon nombre a todas las fotos y clasifica las de menores antes). Si alguna foto de menores no tiene tipo, la app avisa: <strong>Volver a clasificar<\/strong> o <strong>Crear ZIP de todos modos<\/strong> (las no clasificadas van sueltas en su carpeta).<\/li>\n<li>Espera unos segundos: el botón muestra <em>Comprimiendo…<\/em><\/li>\n<li>Aparece la ventana del ZIP con el botón <strong>⬇ Descargar ZIP<\/strong> y un aviso de lo que hacer después.<\/li>\n<li><strong>Correo de destino (opcional):<\/strong> encima del botón final hay un cuadro con el correo de destino ya puesto (<code>hierro.extranjeria@policia.es<\/code>), una <strong>×<\/strong> roja para vaciarlo y un botón <strong>Copiar<\/strong> para pegarlo al enviar. Se guarda en el móvil.<\/li>\n<li><strong>Compártelo desde Descargas:<\/strong> la app no puede enviar el ZIP por sí sola. Ábrelo desde Descargas o Archivos y compártelo por correo o WhatsApp (sección 7).<\/li>\n<\/ol>\n<p>El archivo se llama <strong><code>Fotos Patera X UF+MENAS.zip<\/code><\/strong>, donde X es el número de la patera.<\/p>\n<h3>Qué contiene el ZIP<\/h3>\n<pre><code>Fotos/\n├── UF/\n│   ├── 1-1.jpg\n│   └── Hoja de filiación UF/\n│       └── 1-1.jpg\n└── Menas/\n    ├── Menores Indubitados/\n    │   └── 1.jpg\n    ├── Menores Dubitados/\n    │   └── 2.jpg\n    └── Hoja de filiación MENAS/\n        ├── Menores Indubitados/\n        │   └── 1.jpg\n        └── Menores Dubitados/\n            └── 2.jpg\n<\/code><\/pre>\n<hr />\n<h2 id=\"s7\">7. Enviar un ZIP descargado (Chrome y Safari)<\/h2>\n<p>El ZIP se descarga en el móvil. Así lo envías por correo o WhatsApp:<\/p>\n<h3>🤖 Android (Chrome)<\/h3>\n<ol>\n<li><strong>Abre la descarga:<\/strong> baja la barra de notificaciones y toca <em>Descarga completa<\/em>, o ve a Chrome → ⋮ → <strong>Descargas<\/strong>.<\/li>\n<li><strong>Busca el ZIP:<\/strong> se llama <code>Fotos Patera 129 UF+MENAS.zip<\/code> (el número es el de tu patera).<\/li>\n<li><strong>Pulsa Compartir:<\/strong> mantén pulsado el archivo, o toca sus 3 puntos, y elige <strong>Compartir<\/strong>. Si no aparece, abre la app <strong>Archivos → Descargas<\/strong>.<\/li>\n<li><strong>Elige dónde enviarlo:<\/strong> WhatsApp, Gmail, Drive… No hace falta descomprimirlo.<\/li>\n<\/ol>\n<h3>🍎 iPhone (Safari)<\/h3>\n<ol>\n<li><strong>Pulsa Descargar<\/strong> cuando Safari pregunte si quieres descargar el archivo.<\/li>\n<li><strong>Abre la descarga:<\/strong> toca el icono de flecha en la barra de direcciones y elige el ZIP, o ve a la app <strong>Archivos → Descargas<\/strong>.<\/li>\n<li><strong>Pulsa Compartir:<\/strong> mantén pulsado el ZIP y elige <strong>Compartir<\/strong>. <strong>No lo abras<\/strong>, porque el iPhone lo descomprime.<\/li>\n<li><strong>Elige dónde enviarlo:<\/strong> WhatsApp, Mail, AirDrop…<\/li>\n<\/ol>\n<blockquote>\n<p>📧 El correo suele limitar los adjuntos a unos 25 MB. Si pesa más, usa WhatsApp o Drive.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s8\">8. Borrar pateras<\/h2>\n<ol>\n<li><strong>☰ → Borrar pateras:<\/strong> se muestra la lista con el número de fotos de cada una.<\/li>\n<li><strong>Marca<\/strong> las pateras a borrar (puedes marcar varias).<\/li>\n<li>Pulsa <strong>Borrar seleccionadas<\/strong>. El botón cambia a <em>\"Pulsa otra vez para confirmar el borrado\"<\/em>: púlsalo otra vez.<\/li>\n<\/ol>\n<blockquote>\n<p>🚨 <strong>Atención:<\/strong> se borran los datos y las fotos del móvil y <strong>no se pueden recuperar<\/strong>. Envía antes el mensaje y el ZIP.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s9\">9. Problemas frecuentes<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Problema<\/th>\n<th>Solución<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>La cámara o la galería no se abren<\/td>\n<td>Abre la app en Chrome o Safari (o desde su icono), no desde WhatsApp ni desde el visor de otra app. Revisa que el permiso de cámara esté en <strong>Permitir<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>La app no envía el ZIP<\/td>\n<td>Es normal: el navegador no lo permite. Descárgalo y compártelo desde Descargas o Archivos (sección 7).<\/td>\n<\/tr>\n<tr>\n< else{const f=o.files[0],u=URL.createObjectURL(f);ov(`<b>ZIP listo (${Math.round(f.size/1024)} KB)</b>${getMail()?`<p>Destinatario: <b>${esc(getMail())}</b></p><button class="btn s" id="cm">Copiar correo</button><a class="btn s" href="mailto:${getMail()}?subject=${encodeURIComponent('Fotos patera '+P.id)}&body=${encodeURIComponent('Adjunto el ZIP de fotos de la patera '+P.id)}">Abrir correo (adjunta el ZIP a mano)</a>`:''}<a class="btn" href="${u}" download="${f.name}">⬇ Descargar ZIP</a><div class="card"><b>Después de descargarlo:</b><br>abre el archivo desde tu carpeta de Descargas (o la app Archivos) y compártelo desde ahí por correo, WhatsApp u otra app.</div>`);if($('#cm'))$('#cm').onclick=async()=>{try{await navigator.clipboard.writeText(getMail());$('#cm').textContent='¡Copiado!'}catch(_){}};}}
async function share0(o){try{if(navigator.share&&(!o.files||navigator.canShare?.(o)))return await navigator.share(o);throw 0}catch(e){if(e&&e.name=='AbortError')return;
if(o.text){try{await navigator.clipboard.writeText(o.text);alert('Mensaje copiado. Pégalo en WhatsApp o correo.')}catch(_){alert('No se pudo compartir.')}}
else{const a=document.createElement('a');a.href=URL.createObjectURL(o.files[0]);a.download=o.files[0].name;a.click();alert('ZIP descargado.')}}}
const ext=b=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic'}[b.type]||'jpg');
const safe=s=>s.trim().replace(/[\\/:*?"<>|]/g,'-');
const MK=['menas','menash'],TF={I:'Menores Indubitados',D:'Menores Dubitados'};
async function zip(){const z=new JSZip(),u={};let c=0;
for(const p of P.ph){let n=safe(p.l)||'sin_nombre_'+(++c);let d={uf:'UF',ufh:'UF/Hoja de filiación UF',menas:'Menas',menash:'Menas/Hoja de filiación MENAS'}[p.k]||'Menas';if(MK.includes(p.k)&&TF[p.t])d+='/'+TF[p.t];const key=d+n;u[key]=(u[key]||0)+1;if(u[key]>1)n+='_'+u[key];z.file(`Fotos/${d}/${n}.${ext(p.b)}`,p.b)}
const b=await z.generateAsync({type:'blob'});return new File([b],`Fotos Patera ${P.id} UF+MENAS.zip`,{type:'application/zip'})}
function ph(k,t,pf){const L=P.ph.filter(p=>p.k==k);return`<h3>${t}</h3><div class="row"><div class="btn fb">📷 Hacer foto<input type="file" accept="image/*" capture="environment" data-add="${k}"></div><div class="btn s fb">🖼 Añadir desde la galería<input type="file" accept="image/*" multiple data-add="${k}"></div></div>`+
L.map(p=>`<div class="ph" data-id="${p.i}"><img src="${URL.createObjectURL(p.b)}"><div style="flex:1"><small style="display:block;font-size:12px;color:var(--m);margin-bottom:3px">${pf}</small><input data-n="${p.i}" value="${esc(p.l)}">${MK.includes(k)?`<select data-t="${p.i}" class="${p.t?'':'nt'}"><option value="">— Seleccionar tipo de menor —</option><option value="I"${p.t=='I'?' selected':''}>Menor Indubitado</option><option value="D"${p.t=='D'?' selected':''}>Menor Dubitado</option></select>`:''}</div><button class="x" data-rm="${p.i}">✕</button></div>`).join('')}
function go(v){view=v;$('#dr').classList.remove('on');draw()}
function draw(){$('#ttl').textContent=P?`Patera ${P.id}`:'Informe Patera';
if(view!='list'&&view!='del'&&!P){view='list'}
if(view=='list'){M.innerHTML=`<div class="card"><label>Nueva patera (número)<input type="number" inputmode="numeric" id="np"></label><button class="btn" id="add">Crear patera</button></div><button class="btn y" id="gd">GUIA DE USO</button><h3>Pateras guardadas</h3>`+(all.map(p=>`<div class="card" data-open="${p.id}"><b>Patera ${p.id}</b>${P&&P.id==p.id?' ✔':''}<br><small>${p.ph.length} fotos</small></div>`).join('')||'<p>Aún no hay pateras.</p>')}
else if(view=='msg'){M.innerHTML=F.map(x=>{const h=fld(x),n=IND[x[0]];return n?`<div style="margin-left:${n*16}px;padding-left:8px;border-left:3px solid var(--b)">${h}</div>`:h}).join('')+`<button class="btn" id="fin">Finalizar mensaje inicial</button><button class="btn s" id="pv">Ver / compartir mensaje</button><pre id="pre" class="card hide"></pre>`}
else if(view=='fotos'){M.innerHTML=ph('uf','Fotos UF','Introducir N°UF-N°Foto<br>Ejemplo (1-1)(2-1)(2-2)(3-1)')+ph('ufh','Fotos hoja de filiación UF','Introducir N°UF-N°Foto<br>Ejemplo (1-1)(2-1)(2-2)(3-1)')+ph('menas','Fotos Menas','Introducir N°Pulsera menor<br>Ejemplo (1)(2)')+ph('menash','Fotos hoja de filiación MENAS','Introducir N°Pulsera menor<br>Ejemplo (1)(2)')+mailBox()+`<button class="btn" id="zip">Finalizar y descargar ZIP</button>`}
else{M.innerHTML=`<p>Selecciona las pateras a borrar del dispositivo (datos y fotos).</p>`+(all.map(p=>`<label class="card"><input type="checkbox" style="width:auto" data-del="${p.id}"> Patera ${p.id} (${p.ph.length} fotos)</label>`).join('')||'<p>No hay pateras.</p>')+`<button class="btn d" id="bd">Borrar seleccionadas</button>`}}
$('#mn').onclick=()=>{let d=$('#mp');if(d)return;d=document.createElement('div');d.id='mp';d.innerHTML='<header><b>Manual detallado</b><button id="mx">✕ Cerrar</button></header><div class="md">'+MAN+'</div>';document.body.appendChild(d);$('#mx').onclick=()=>d.remove();d.onclick=e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const x=d.querySelector(a.getAttribute('href'));if(x)x.scrollIntoView()}}};
$('#mb').onclick=()=>$('#dr').classList.add('on');
$('#dr').onclick=e=>{const v=e.target.dataset.v;if(v)go(v);else if(e.target.id=='dr')$('#dr').classList.remove('on')};
M.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(t.dataset.mail!==undefined){try{localStorage.setItem('mail',t.value.trim())}catch(_){}return}
if(k){P.f[k]=t.value;if(t.tagName=='SELECT')t.closest('label').nextElementSibling.classList.toggle('hide',t.value!='Otro');if(k=='uf'||k=='uv')$('#L_'+k).innerHTML=lst(k);sv()}
else if(t.dataset.l){P.f[t.dataset.l+'_l'][+t.dataset.i]=t.value;sv()}
else if(t.dataset.n){P.ph.find(p=>p.i==t.dataset.n).l=t.value;sv()}
else if(t.dataset.t){P.ph.find(p=>p.i==t.dataset.t).t=t.value;t.classList.toggle('nt',!t.value);sv()}});
M.addEventListener('change',async e=>{const t=e.target;if(t.dataset.p!==undefined){const m=t.value.match(/\d+/g);t.value=m?m.map(x=>'P'+x).join(', '):'';P.f[t.dataset.k]=t.value;sv();return}
if(t.dataset.add){for(const f of t.files)P.ph.push({i:Date.now()+Math.random().toString(36).slice(2),k:t.dataset.add,l:'',b:f});draw();try{await tx('readwrite',s=>s.put(P))}catch(_){alert('Foto añadida, pero no se pudo guardar en el dispositivo.')}}});
M.addEventListener('click',async e=>{const t=e.target,id=t.id;
const o=t.closest('[data-open]');if(o){P=all.find(p=>p.id==o.dataset.open);return go('msg')}
if(id=='add'){const n=+$('#np').value;if(!n)return alert('Introduce un número');if(!all.find(p=>p.id==n)){P={id:n,f:{emb:String(n)},ph:[]};await tx('readwrite',s=>s.put(P));await loadAll()}else P=all.find(p=>p.id==n);go('msg')}
if(id=='fin'){sv();const f=P.f,tp=+f.tp||0,sm=(+f.tmen||0)+(+f.ma||0)+(+f.ha||0),d=tp-sm;
if(d){const o=ov(`<b>⚠ Los totales no coinciden</b><p>TOTAL PERSONAS: ${tp}<br>Menores + mujeres adultas + hombres adultos: ${sm}<br><b>Diferencia: ${Math.abs(d)}</b> (la suma es ${Math.abs(d)} ${d>0?'menos':'más'} que el total de personas)</p><button class="btn" id="go">Finalizar de todos modos</button>`,'Volver a editar');$('#go').onclick=()=>{o.remove();share({text:msg()})}}
else share({text:msg()})}
if(t.dataset.clrm!==undefined){const i=t.previousElementSibling;i.value='';try{localStorage.setItem('mail','')}catch(_){}i.focus();return}
if(t.dataset.clr){const i=t.previousElementSibling;i.value='';P.f[t.dataset.clr]='';sv();i.focus();return}
if(t.dataset.chip){const n=t.dataset.chip,i=M.querySelector('[data-k="nac"]'),a=i.value.split(/\s*(?:,|\sy\s)\s*/).map(x=>x.trim()).filter(Boolean);if(!a.some(x=>x.toLowerCase()==n.toLowerCase()))a.push(n);i.value=a.length>1?a.slice(0,-1).join(', ')+' y '+a.at(-1):a[0];P.f.nac=i.value;sv();return}
if(id=='cpm'){const i=t.previousElementSibling.querySelector('input'),v=i.value.trim();if(!v)return;try{await navigator.clipboard.writeText(v)}catch(_){i.select();document.execCommand('copy')}t.textContent='¡Copiado!';setTimeout(()=>{t.textContent='Copiar'},1500);return}
if(id=='gd')return openGuide();
if(id=='pv'){const r=$('#pre');r.textContent=msg();r.classList.toggle('hide')}
if(t.dataset.rm){P.ph=P.ph.filter(p=>p.i!=t.dataset.rm);draw();sv()}
if(id=='zip'){if(!P.ph.length)return alert('No hay fotos');if(!window.JSZip)return alert('No se pudo cargar el compresor ZIP. Revisa la conexión.');
const mk=async()=>{const b=$('#zip');if(b)b.textContent='Comprimiendo…';try{const f=await zip();share({files:[f],title:f.name})}catch(er){alert('Error al crear el ZIP')}if(b)b.textContent='Finalizar y descargar ZIP'};
const nc=P.ph.filter(p=>MK.includes(p.k)&&!TF[p.t]).length;
if(nc){const o=ov(`<b>⚠ Fotos de menores sin clasificar</b><p>Hay <b>${nc}</b> foto(s) de menores sin marcar como <b>Menor Indubitado</b> o <b>Menor Dubitado</b>. Si continúas, irán sueltas en la carpeta Menas (o en su Hoja de filiación) sin clasificar.</p><button class="btn" id="go">Crear ZIP de todos modos</button>`,'Volver a clasificar');$('#go').onclick=()=>{o.remove();mk()}}
else mk()}
if(id=='bd'){const ids=[...M.querySelectorAll('[data-del]:checked')].map(c=>+c.dataset.del);if(!ids.length)return;if(t.dataset.c!=ids.join()){t.dataset.c=ids.join();t.textContent='Pulsa otra vez para confirmar el borrado';return}
for(const i of ids)await tx('readwrite',s=>s.delete(i));if(P&&ids.includes(P.id))P=null;await loadAll();draw()}});
(async()=>{try{db=await open();await loadAll()}catch(e){M.textContent='Almacenamiento no disponible';return}draw()})();
</script></body></html>
