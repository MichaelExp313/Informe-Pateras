<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Informe Patera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#111;--m:#667;--a:#0a5cc2;--b:#d3d8e0;--r:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--c:#1b212a;--t:#eee;--m:#9aa5b1;--a:#5aa2ff;--b:#333c48;--r:#ef7a7a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--a);color:#fff}
header b{flex:1;font-size:17px}
#mb{background:none;border:0;color:#fff;font-size:26px}
#dr{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#dr.on{display:block}
#dr nav{background:var(--c);width:78%;max-width:300px;height:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 0}
#dr a{display:block;padding:15px 20px;border-bottom:1px solid var(--b)}
main{padding:12px;max-width:640px;margin:auto}
label{display:block;font-size:13px;color:var(--m);margin-top:12px}
input,select,textarea{width:100%;padding:11px;margin-top:4px;font-size:16px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.hide{display:none}
.btn{display:block;width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:var(--a);color:#fff;font-size:16px;text-align:center}
.btn.s{background:var(--c);color:var(--a);border:1px solid var(--a)}.btn.d{background:var(--r)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.ph{display:flex;gap:10px;margin-top:10px;align-items:center}
.ph img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.ph input{margin:0}.x{flex:0 0 auto!important;width:auto!important;background:none;border:0;color:var(--r);font-size:22px}
.y{background:#ffd400;color:#111;font-weight:700;font-size:18px;border:2px solid #b38f00}
h3{margin:18px 0 0}pre{white-space:pre-wrap;word-break:break-word;font:14px monospace}
.fb{position:relative;overflow:hidden}.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;font-size:0;cursor:pointer}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#ov .card{width:100%;max-width:500px;max-height:90%;overflow:auto}#ov a.btn{text-decoration:none}
.u{display:flex;gap:6px;align-items:center;margin-top:6px}.u span{color:var(--m)}.u input{margin:0}
</style></head><body>

const b=await z.generateAsync({type:'blob'});return new File([b],`Fotos_patera_${P.id}.zip`,{type:'application/zip'})}
function ph(k,t,pf){const L=P.ph.filter(p=>p.k==k);return`<h3>${t}</h3><div class="row"><div class="btn fb">📷 Hacer foto<input type="file" accept="image/*" capture="environment" data-add="${k}"></div><div class="btn s fb">🖼 Añadir desde la galería<input type="file" accept="image/*" multiple data-add="${k}"></div></div>`+
L.map(p=>`<div class="ph" data-id="${p.i}"><img src="${URL.createObjectURL(p.b)}"><input data-n="${p.i}" placeholder="${pf}" value="${esc(p.l)}"><button class="x" data-rm="${p.i}">✕</button></div>`).join('')}
function go(v){view=v;$('#dr').classList.remove('on');draw()}
function draw(){$('#ttl').textContent=P?`Patera ${P.id}`:'Informe Patera';
if(view!='list'&&view!='del'&&!P){view='list'}
if(view=='list'){M.innerHTML=`<div class="card"><label>Nueva patera (número)<input type="number" inputmode="numeric" id="np"></label><button class="btn" id="add">Crear patera</button></div><button class="btn y" id="gd">GUIA DE USO</button><h3>Pateras guardadas</h3>`+(all.map(p=>`<div class="card" data-open="${p.id}"><b>Patera ${p.id}</b>${P&&P.id==p.id?' ✔':''}<br><small>${p.ph.length} fotos</small></div>`).join('')||'<p>Aún no hay pateras.</p>')}
else if(view=='msg'){M.innerHTML=F.map(x=>{const h=fld(x),n=IND[x[0]];return n?`<div style="margin-left:${n*16}px;padding-left:8px;border-left:3px solid var(--b)">${h}</div>`:h}).join('')+`<button class="btn" id="fin">Finalizar mensaje inicial</button><button class="btn s" id="pv">Ver / compartir mensaje</button><pre id="pre" class="card hide"></pre>`}
else if(view=='fotos'){M.innerHTML=ph('uf','Fotos UF','1-1')+ph('ufh','Fotos hoja de filiación UF','1-1')+ph('menas','Fotos Menas','1')+ph('menash','Fotos hoja de filiación MENAS','1')+mailBox()+`<button class="btn" id="zip">Finalizar y descargar ZIP</button>`}
else{M.innerHTML=`<p>Selecciona las pateras a borrar del dispositivo (datos y fotos).</p>`+(all.map(p=>`<label class="card"><input type="checkbox" style="width:auto" data-del="${p.id}"> Patera ${p.id} (${p.ph.length} fotos)</label>`).join('')||'<p>No hay pateras.</p>')+`<button class="btn d" id="bd">Borrar seleccionadas</button>`}}
$('#mb').onclick=()=>$('#dr').classList.add('on');
$('#dr').onclick=e=>{const v=e.target.dataset.v;if(v)go(v);else if(e.target.id=='dr')$('#dr').classList.remove('on')};
M.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(t.dataset.mail!==undefined){try{localStorage.setItem('mail',t.value.trim())}catch(_){}return}
if(k){P.f[k]=t.value;if(t.tagName=='SELECT')t.closest('label').nextElementSibling.classList.toggle('hide',t.value!='Otro');if(k=='uf'||k=='uv')$('#L_'+k).innerHTML=lst(k);sv()}
else if(t.dataset.l){P.f[t.dataset.l+'_l'][+t.dataset.i]=t.value;sv()}
else if(t.dataset.n){P.ph.find(p=>p.i==t.dataset.n).l=t.value;sv()}});
M.addEventListener('change',async e=>{const t=e.target;if(t.dataset.p!==undefined){const m=t.value.match(/\d+/g);t.value=m?m.map(x=>'P'+x).join(', '):'';P.f[t.dataset.k]=t.value;sv();return}
if(t.dataset.add){for(const f of t.files)P.ph.push({i:Date.now()+Math.random().toString(36).slice(2),k:t.dataset.add,l:'',b:f});draw();try{await tx('readwrite',s=>s.put(P))}catch(_){alert('Foto añadida, pero no se pudo guardar en el dispositivo.')}}});
M.addEventListener('click',async e=>{const t=e.target,id=t.id;
const o=t.closest('[data-open]');if(o){P=all.find(p=>p.id==o.dataset.open);return go('msg')}
if(id=='add'){const n=+$('#np').value;if(!n)return alert('Introduce un número');if(!all.find(p=>p.id==n)){P={id:n,f:{emb:String(n)},ph:[]};await tx('readwrite',s=>s.put(P));await loadAll()}else P=all.find(p=>p.id==n);go('msg')}
if(id=='fin'){sv();const f=P.f,tp=+f.tp||0,sm=(+f.tmen||0)+(+f.ma||0)+(+f.ha||0),d=tp-sm;
if(d){const o=ov(`<b>⚠ Los totales no coinciden</b><p>TOTAL PERSONAS: ${tp}<br>Menores + mujeres adultas + hombres adultos: ${sm}<br><b>Diferencia: ${Math.abs(d)}</b> (la suma es ${Math.abs(d)} ${d>0?'menos':'más'} que el total de personas)</p><button class="btn" id="go">Finalizar de todos modos</button>`,'Volver a editar');$('#go').onclick=()=>{o.remove();share({text:msg()})}}
else share({text:msg()})}
if(id=='cpm'){const i=t.previousElementSibling,v=i.value.trim();if(!v)return;try{await navigator.clipboard.writeText(v)}catch(_){i.select();document.execCommand('copy')}t.textContent='¡Copiado!';setTimeout(()=>{t.textContent='Copiar'},1500);return}
if(id=='gd')return openGuide();
if(id=='pv'){const r=$('#pre');r.textContent=msg();r.classList.toggle('hide')}
if(t.dataset.rm){P.ph=P.ph.filter(p=>p.i!=t.dataset.rm);draw();sv()}
if(id=='zip'){if(!P.ph.length)return alert('No hay fotos');if(!window.JSZip)return alert('No se pudo cargar el compresor ZIP. Revisa la conexión.');t.textContent='Comprimiendo…';try{const f=await zip();share({files:[f],title:f.name})}catch(er){alert('Error al crear el ZIP')}t.textContent='Finalizar y descargar ZIP'}
if(id=='bd'){const ids=[...M.querySelectorAll('[data-del]:checked')].map(c=>+c.dataset.del);if(!ids.length)return;if(t.dataset.c!=ids.join()){t.dataset.c=ids.join();t.textContent='Pulsa otra vez para confirmar el borrado';return}
for(const i of ids)await tx('readwrite',s=>s.delete(i));if(P&&ids.includes(P.id))P=null;await loadAll();draw()}});
(async()=>{try{db=await open();await loadAll()}catch(e){M.textContent='Almacenamiento no disponible';return}draw()})();
</script></body></html>
